name: Project #1 PR 自动回填与红线校验

on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-guardrails:
    name: 红线校验（禁止自动关闭 Issue）
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 正文不使用 Closes/Fixes/Resolves
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const forbidden = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#\d+/i;
            if (forbidden.test(body)) {
              core.setFailed(
                'PR 正文包含 Closes/Fixes/Resolves，会导致合并时跳过人工验收直接关闭 Issue。请改为 `Refs Mixlong/DigiwiseStudio-Admin-Java#<编号>`。'
              );
            } else {
              core.info('红线校验通过：未发现自动关闭 Issue 的关键字。');
            }

  sync-project-board:
    name: 自动回填 Project #1 看板字段
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: 解析关联 Issue 并同步到 Mixlong/projects/1
        uses: actions/github-script@v7
        env:
          HAS_PROJECT_PAT: ${{ secrets.PROJECT_PAT != '' }}
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            if (process.env.HAS_PROJECT_PAT !== 'true') {
              core.warning('未配置 Secrets.PROJECT_PAT，跳过 Project #1 自动回填。');
              return;
            }

            const OWNER = 'Mixlong';
            const TRACKING_REPO = 'DigiwiseStudio-Admin-Java';
            const PROJECT_NUMBER = 1;

            const pr = context.payload.pull_request;
            const text = `${pr.title || ''}\n${pr.body || ''}`;

            // 提取 Refs Mixlong/DigiwiseStudio-Admin-Java#27 #8 或 Refs #27
            const issueNumbers = new Set();
            const refLines = text.match(/Refs?\s+[^\n\r]+/gi) || [];
            for (const line of refLines) {
              const crossMatches = line.matchAll(/Mixlong\/DigiwiseStudio-Admin-Java#(\d+)/gi);
              for (const m of crossMatches) issueNumbers.add(Number(m[1]));

              if (context.repo.repo.toLowerCase() === TRACKING_REPO.toLowerCase() || /Mixlong\/DigiwiseStudio-Admin-Java#\d+/i.test(line)) {
                const shortMatches = line.matchAll(/(?:^|[\s,，;；])#(\d+)/g);
                for (const m of shortMatches) issueNumbers.add(Number(m[1]));
              }
            }

            if (issueNumbers.size === 0) {
              core.info('PR 中未检测到 `Refs #编号`，跳过看板回填。');
              return;
            }

            core.info(`检测到关联 Issue: ${[...issueNumbers].map(n => '#' + n).join(', ')}`);

            // 查询 Project #1 字段和条目
            const query = `
              query($owner: String!, $number: Int!, $cursor: String) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2FieldCommon { id name }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                            repository { name owner { login } }
                          }
                        }
                        fieldValues(first: 30) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field { ... on ProjectV2FieldCommon { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let projectId = null;
            const fieldsByName = new Map();
            const itemsByIssue = new Map();
            let cursor = null;

            while (true) {
              const res = await github.graphql(query, {
                owner: OWNER,
                number: PROJECT_NUMBER,
                cursor
              });
              const proj = res.user.projectV2;
              projectId = proj.id;
              if (fieldsByName.size === 0) {
                for (const f of proj.fields.nodes) {
                  if (f && f.name) fieldsByName.set(f.name, f);
                }
              }
              for (const item of proj.items.nodes) {
                const c = item.content;
                if (c && c.number && c.repository && c.repository.name.toLowerCase() === TRACKING_REPO.toLowerCase()) {
                  const vals = {};
                  for (const fv of item.fieldValues.nodes) {
                    if (fv && fv.field && fv.field.name) vals[fv.field.name] = fv.name;
                  }
                  itemsByIssue.set(c.number, { id: item.id, values: vals });
                }
              }
              if (!proj.items.pageInfo.hasNextPage) break;
              cursor = proj.items.pageInfo.endCursor;
            }

            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: $value
                }) {
                  projectV2Item { id }
                }
              }
            `;

            async function setText(itemId, fieldName, textVal) {
              const f = fieldsByName.get(fieldName);
              if (!f) return;
              await github.graphql(updateMutation, {
                projectId,
                itemId,
                fieldId: f.id,
                value: { text: textVal }
              });
            }

            async function setSelect(itemId, fieldName, optionName) {
              const f = fieldsByName.get(fieldName);
              if (!f || !f.options) return;
              const opt = f.options.find(o => o.name === optionName);
              if (!opt) return;
              await github.graphql(updateMutation, {
                projectId,
                itemId,
                fieldId: f.id,
                value: { singleSelectOptionId: opt.id }
              });
            }

            const branchText = `${context.repo.repo}:${pr.head.ref}`;
            const prUrl = pr.html_url;

            for (const num of issueNumbers) {
              const item = itemsByIssue.get(num);
              if (!item) {
                core.info(`Issue #${num} 不在 Project #1 中，跳过。`);
                continue;
              }
              await setText(item.id, 'Git 分支', branchText);
              await setText(item.id, '证据链接', prUrl);

              const curStatus = item.values['Status'];
              if (!curStatus || curStatus === 'Todo' || curStatus === 'In Progress') {
                await setSelect(item.id, 'Status', 'In Review');
              }

              const curWait = item.values['等待环节'];
              if (!curWait || curWait === '待分派' || curWait === '无等待') {
                await setSelect(item.id, '等待环节', '待代码审查');
              }

              core.info(`已同步 #${num}: 分支=${branchText}, PR=${prUrl}`);
            }
