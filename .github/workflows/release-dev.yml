name: DigiStudio Dev Release

on:
    push:
        branches:
            - codex/integrate-upstream
            - dev
    workflow_dispatch:
        inputs:
            release_version:
                description: "可选版本号，例如 0.0.14-dev.10；留空则使用流水线编号"
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: digistudio-dev-release
    cancel-in-progress: false

env:
    EEZ_UPDATE_ROOT: https://bikewise.oss-cn-shenzhen.aliyuncs.com/d-space/DigiwiseStudio

jobs:
    prepare:
        name: Prepare release version
        runs-on: ubuntu-22.04
        outputs:
            version: ${{ steps.version.outputs.value }}
        steps:
            - name: Resolve release version
              id: version
              env:
                  REQUESTED_VERSION: ${{ inputs.release_version }}
              run: |
                  if [ -n "$REQUESTED_VERSION" ]; then
                    version="$REQUESTED_VERSION"
                  else
                    version="0.0.14-dev.${GITHUB_RUN_NUMBER}"
                  fi

                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
                    echo "Invalid development release version: $version" >&2
                    exit 1
                  fi

                  echo "value=$version" >> "$GITHUB_OUTPUT"
                  echo "Building $version"

    build:
        name: Build ${{ matrix.platform }}
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macOS
                      runner: macos-15
                      script: release:dev:mac
                      artifact: release-macos
                    - platform: Windows x64
                      runner: windows-2022
                      script: release:dev:win
                      artifact: release-windows-x64
        runs-on: ${{ matrix.runner }}
        env:
            RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build release package
              run: npm run ${{ matrix.script }}

            - name: Verify staged release files
              shell: bash
              run: |
                  test -d release-oss/DigiwiseStudio
                  find release-oss/DigiwiseStudio -type f -maxdepth 3 -print

            - name: Upload staged release
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: release-oss/DigiwiseStudio
                  if-no-files-found: error
                  retention-days: 7

    stage:
        name: Stage release for Yunxiao
        needs:
            - prepare
            - build
        runs-on: ubuntu-22.04
        permissions:
            actions: read
            contents: write
        env:
            RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Download staged releases
              uses: actions/download-artifact@v4
              with:
                  pattern: release-*
                  path: release-oss/DigiwiseStudio
                  merge-multiple: true

            - name: Verify release files
              shell: bash
              run: |
                  test -f release-oss/DigiwiseStudio/dist-mac/latest-mac.yml
                  test -f release-oss/DigiwiseStudio/dist-win-x64/latest.yml
                  find release-oss/DigiwiseStudio -type f -maxdepth 3 -print

            - name: Create Yunxiao handoff packages
              shell: bash
              run: |
                  mkdir -p yunxiao-release
                  tar -czf "yunxiao-release/DigiStudio-${RELEASE_VERSION}-mac.tar.gz" \
                    -C release-oss/DigiwiseStudio dist-mac
                  tar -czf "yunxiao-release/DigiStudio-${RELEASE_VERSION}-win-x64.tar.gz" \
                    -C release-oss/DigiwiseStudio dist-win-x64
                  sha256sum yunxiao-release/*

            - name: Publish temporary GitHub release for Yunxiao
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  tag="digi-dev-${RELEASE_VERSION}"
                  title="DigiStudio Dev ${RELEASE_VERSION}"
                  if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    gh release upload "$tag" yunxiao-release/* \
                      --repo "$GITHUB_REPOSITORY" \
                      --clobber
                  else
                    gh release create "$tag" yunxiao-release/* \
                      --repo "$GITHUB_REPOSITORY" \
                      --prerelease \
                      --target "$GITHUB_SHA" \
                      --title "$title" \
                      --notes "GitHub 负责构建，云效负责上传 OSS。"
                  fi
                  echo "Yunxiao release tag: $tag"
