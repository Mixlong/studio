name: DigiStudio Dev Release

on:
    push:
        branches:
            - codex/integrate-upstream
            - dev
    workflow_dispatch:
        inputs:
            release_version:
                description: "可选版本号，例如 0.0.14-dev.10；留空则使用流水线编号"
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: digistudio-dev-release
    cancel-in-progress: false

env:
    EEZ_UPDATE_ROOT: https://bikewise.oss-cn-shenzhen.aliyuncs.com/d-space/DigiwiseStudio

jobs:
    prepare:
        name: Prepare release version
        runs-on: ubuntu-22.04
        outputs:
            version: ${{ steps.version.outputs.value }}
        steps:
            - name: Resolve release version
              id: version
              env:
                  REQUESTED_VERSION: ${{ inputs.release_version }}
              run: |
                  if [ -n "$REQUESTED_VERSION" ]; then
                    version="$REQUESTED_VERSION"
                  else
                    version="0.0.14-dev.${GITHUB_RUN_NUMBER}"
                  fi

                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
                    echo "Invalid development release version: $version" >&2
                    exit 1
                  fi

                  echo "value=$version" >> "$GITHUB_OUTPUT"
                  echo "Building $version"

    build:
        name: Build ${{ matrix.platform }}
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macOS
                      runner: macos-15
                      script: release:dev:mac
                      artifact: release-macos
                    - platform: Windows x64
                      runner: windows-2022
                      script: release:dev:win
                      artifact: release-windows-x64
        runs-on: ${{ matrix.runner }}
        env:
            RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build release package
              run: npm run ${{ matrix.script }}

            - name: Verify staged release files
              shell: bash
              run: |
                  test -d release-oss/DigiwiseStudio
                  find release-oss/DigiwiseStudio -maxdepth 3 -type f -print

            - name: Upload staged release
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: release-oss/DigiwiseStudio
                  if-no-files-found: error
                  retention-days: 7

    publish:
        name: Create GitHub release and trigger Yunxiao
        needs:
            - prepare
            - build
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        env:
            RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
            YUNXIAO_RELEASE_WEBHOOK_URL: ${{ secrets.YUNXIAO_RELEASE_WEBHOOK_URL }}
        steps:
            - name: Download staged releases
              uses: actions/download-artifact@v4
              with:
                  pattern: release-*
                  path: release-oss/DigiwiseStudio
                  merge-multiple: true

            - name: Verify staged release files
              shell: bash
              run: |
                  test -f release-oss/DigiwiseStudio/dist-mac/latest-mac.yml
                  test -f release-oss/DigiwiseStudio/dist-win-x64/latest.yml
                  find release-oss/DigiwiseStudio -maxdepth 3 -type f -print

            - name: Package release assets
              shell: bash
              run: |
                  set -euo pipefail
                  mac_archive="DigiStudio-${RELEASE_VERSION}-mac.tar.gz"
                  win_archive="DigiStudio-${RELEASE_VERSION}-win-x64.tar.gz"

                  tar -czf "$RUNNER_TEMP/$mac_archive" \
                    -C release-oss/DigiwiseStudio dist-mac
                  tar -czf "$RUNNER_TEMP/$win_archive" \
                    -C release-oss/DigiwiseStudio dist-win-x64

                  test -s "$RUNNER_TEMP/$mac_archive"
                  test -s "$RUNNER_TEMP/$win_archive"

            - name: Create GitHub development release
              id: release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="digi-dev-${RELEASE_VERSION}"

                  if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "GitHub release already exists: $tag" >&2
                    echo "Choose a new release_version for a manual run." >&2
                    exit 1
                  fi

                  gh release create "$tag" \
                    "$RUNNER_TEMP/DigiStudio-${RELEASE_VERSION}-mac.tar.gz" \
                    "$RUNNER_TEMP/DigiStudio-${RELEASE_VERSION}-win-x64.tar.gz" \
                    --repo "$GITHUB_REPOSITORY" \
                    --target "$GITHUB_SHA" \
                    --title "DigiStudio ${RELEASE_VERSION}" \
                    --notes "自动生成的开发版 ${RELEASE_VERSION}" \
                    --prerelease

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "Created GitHub release: $tag"

            - name: Trigger Yunxiao release pipeline
              shell: bash
              run: |
                  set -euo pipefail
                  test -n "$YUNXIAO_RELEASE_WEBHOOK_URL" || {
                    echo "Missing YUNXIAO_RELEASE_WEBHOOK_URL GitHub secret" >&2
                    exit 1
                  }

                  payload="$(printf '{\"RELEASE_TAG\":\"%s\"}' '${{ steps.release.outputs.tag }}')"
                  curl --fail --silent --show-error --location \
                    --retry 5 --retry-delay 2 \
                    --connect-timeout 20 --max-time 60 \
                    -X POST \
                    -H 'Content-Type: application/json' \
                    --data "$payload" \
                    "$YUNXIAO_RELEASE_WEBHOOK_URL"

                  echo "Yunxiao release pipeline triggered for ${{ steps.release.outputs.tag }}"
